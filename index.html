<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jade Villarez | Profile Card</title>
  <style>
    /* Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1b1b1b, #333);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #f5f5f5;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      width: 360px;
      overflow: hidden;
      transition: 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 40px rgba(255, 255, 255, 0.1);
    }

    .profile-header {
      background: linear-gradient(135deg, #444, #666);
      height: 100px;
    }

    .profile-image {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.4);
      object-fit: cover;
      margin: -50px auto 10px;
      display: block;
      filter: grayscale(100%);
    }

    .profile-content {
      text-align: center;
      padding: 1.2rem;
    }

    .profile-content h1 {
      font-size: 1.6rem;
      color: #fff;
    }

    .profile-content p {
      font-size: 0.95rem;
      color: #cfcfcf;
      margin: 0.4rem 0 1.2rem;
    }

    .info {
      text-align: left;
      font-size: 0.9rem;
      color: #ccc;
      margin: 0.5rem 1rem;
    }

    .info strong {
      color: #fff;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .socials a {
      color: #f1f1f1;
      text-decoration: none;
      font-size: 1.2rem;
      transition: 0.3s;
    }

    .socials a:hover {
      color: #aaa;
    }

    .btn {
      display: block;
      margin: 1.5rem auto;
      padding: 0.6rem 1.5rem;
      border-radius: 25px;
      background: #555;
      color: #fff;
      border: none;
      text-decoration: none;
      width: fit-content;
      transition: 0.3s;
    }

    .btn:hover {
      background: #777;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="profile-header"></div>
    <img src="https://i.pravatar.cc/100?img=68" alt="Profile" class="profile-image" />
    <div class="profile-content">
      <h1>Jade Villarez</h1>
      <p>Dedicated student passionate about learning, creativity, and academic excellence.</p>
      <div class="info">
        <p><strong>School:</strong> Greenfield National High School</p>
        <p><strong>Grade Level:</strong> 11 - STEM Strand</p>
        <p><strong>Location:</strong> Laguna, Philippines</p>
      </div>
      <div class="socials">
        <a href="#"><ion-icon name="logo-facebook"></ion-icon></a>
        <a href="#"><ion-icon name="logo-instagram"></ion-icon></a>
        <a href="#"><ion-icon name="logo-github"></ion-icon></a>
      </div>
      <a href="#" class="btn">View Portfolio</a>
    </div>
  </div>

  <!-- Ionicons (for social media icons) -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
